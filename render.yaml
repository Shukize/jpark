databases:
  - name: jpark-db
    databaseName: jpark
    user: jpark
    plan: free

services:
  # ── API (Node/Express) ──────────────────────────────────────────────────────
  - type: web
    name: jpark
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jpark-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        # Comma-separated allowlist. The live site is served from GitHub Pages
        # (Shukize/jpark → shukize.github.io); the Render static site is kept as
        # a fallback. Add a custom domain here if/when you set one up.
        value: https://shukize.github.io,https://jpark-site.onrender.com
      - key: OTA_WEBHOOK_SECRET
        sync: false  # set this manually in the Render dashboard — never commit the real value

  # ── Static front-end ────────────────────────────────────────────────────────
  - type: static
    name: jpark-site
    buildCommand: ""        # no build step — plain HTML/CSS/JS
    staticPublishPath: .    # serve from the repo root
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
