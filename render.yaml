# ── J Park Hotel — Render blueprint (Option B) ───────────────────────────────
# Hosting plan:
#   • Frontend  → GitHub Pages (free)            — primary live site
#   • Database  → Neon Postgres (free, durable)  — set DATABASE_URL below
#   • API       → Render Starter ($7/mo, no cold-start spin-down)
#   • Email     → Resend (free tier)             — set RESEND_API_KEY below
#
# The Render-managed free Postgres has been removed: free Render databases are
# deleted after a fixed window, so the data now lives on Neon instead. Paste the
# Neon connection string into DATABASE_URL in the Render dashboard (it's marked
# sync:false so it is never committed to git).

services:
  # ── API (Node/Express) ──────────────────────────────────────────────────────
  - type: web
    name: jpark
    runtime: node
    plan: starter           # was "free" — Starter keeps the API always-on (no 50s cold start)
    buildCommand: cd backend && npm install && npm test
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false         # paste the Neon connection string here in the Render dashboard
      - key: FRONTEND_ORIGIN
        # Comma-separated CORS allowlist. jparkhotel.com is the live custom
        # domain (served by GitHub Pages); shukize.github.io is kept as a
        # fallback. Add/remove origins here, then re-sync the blueprint.
        value: https://jparkhotel.com,https://www.jparkhotel.com,https://shukize.github.io
      - key: OTA_WEBHOOK_SECRET
        # Shared secret for inbound OTA traffic. Gates BOTH the channel-manager
        # webhook (POST /api/v1/ota-sync) and the booking-ingest endpoint
        # (POST /api/guest-bookings, via X-API-Key). Set the same value in the
        # channel manager. Leave unset only for local/demo (endpoint stays open).
        sync: false         # set manually in the Render dashboard — never commit the real value
      - key: AUTH_TOKEN_SECRET
        sync: false         # server-side JWT signing secret — set a long random string
      - key: RESEND_API_KEY
        sync: false         # Resend API key (re_...) for transactional email
      - key: EMAIL_FROM
        # Domain-verified sender on jparkhotel.com (Resend). If you ever need
        # to fall back to the sandbox sender, use: onboarding@resend.dev
        value: J Park Hotel <noreply@jparkhotel.com>
      - key: HOTEL_NOTIFY_EMAIL
        # Front-desk inbox that receives a notice for every new booking that
        # lands in the Guest Booking system. Comma-separate for multiple staff.
        value: jparkhotel1@gmail.com
      # ── Online booking payments (Omise / Opn Payments) ───────────────────
      # Card + PromptPay QR. Leave the keys unset to keep online payment
      # disabled — the booking page falls back to pay-at-checkin-only with
      # zero visible change. See docs/PAYMENTS_SETUP.md.
      #
      # >>> GO-LIVE IS EXACTLY THESE TWO VALUES. <<<
      # Paste the keys from the Omise dashboard here and save. Nothing else
      # needs changing: the provider is auto-detected from the keys, the
      # webhook URL builds itself from RENDER_EXTERNAL_URL, and no redeploy
      # or code change is involved. Use the skey_test_/pkey_test_ pair first
      # (Test mode, no real money), then swap in the live pair.
      - key: OMISE_PUBLIC_KEY
        sync: false         # pkey_… — browser-safe, card tokenization only
      - key: OMISE_SECRET_KEY
        sync: false         # skey_… — server-side only, never expose
      - key: PUBLIC_SITE_URL
        # Where a guest is sent back to after a 3-D Secure card challenge.
        # Must be the PUBLIC website, not this API.
        value: https://jparkhotel.com
      - key: PAYMENT_WEBHOOK_SECRET
        # Guards the webhook URL (?key=...) and unlocks the browser-openable
        # form of GET /api/v1/payments/diagnostics. Every webhook is
        # re-verified against Omise's API regardless, so this is a secondary
        # guard — but SET IT: without it the diagnostics page is
        # admin-session-only, which is the awkward moment you least want it.
        sync: false
      - key: OMISE_WEBHOOK_SIGNING_SECRET
        # Optional. The webhook secret from the Omise dashboard's Webhooks
        # page (base64). When set, every delivery's Omise-Signature header is
        # verified with HMAC-SHA256 before anything else happens, so forged
        # posts are rejected without costing an API call. Test and live have
        # SEPARATE secrets — swap this when you swap the keys.
        sync: false
      - key: PAYMENT_PROVIDER
        # Pinned to Omise, the hotel's approved acquirer. Auto-detect would
        # also land on Omise, but pinning means the live gateway can never be
        # decided by which keys happen to be present in the environment.
        value: omise
      # GB Prime Pay is NOT in use — Omise is the hotel's acquirer. Its adapter
      # stays in the codebase as a tested fallback (the acquirer changed twice
      # in one day once), but nothing here is set and PAYMENT_PROVIDER above
      # pins Omise regardless, so it cannot activate by accident.

  # The public website is served solely by GitHub Pages (free) — primary URL
  # shukize.github.io/jpark, custom domain jparkhotel.com. The former
  # Render "jpark-site" static mirror was retired to keep one canonical site;
  # delete that service in the Render dashboard so a blueprint sync won't
  # recreate it.
