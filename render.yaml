databases:
  - name: jpark-db
    databaseName: jpark
    user: jpark
    plan: free

services:
  # ── API (Node/Express) ──────────────────────────────────────────────────────
  - type: web
    name: jpark-api
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jpark-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://jpark-site.onrender.com  # update if using a custom domain
      - key: OTA_WEBHOOK_SECRET
        sync: false  # set this manually in the Render dashboard — never commit the real value

  # ── Static front-end ────────────────────────────────────────────────────────
  - type: static
    name: jpark-site
    buildCommand: ""        # no build step — plain HTML/CSS/JS
    staticPublishPath: .    # serve from the repo root
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
