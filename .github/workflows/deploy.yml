name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build step publishes this repo byte-for-byte, so a single syntax
      # error in any hand-written JS file would otherwise ship straight to
      # production (this has happened before — a stray character silently
      # broke every app string). Fail the deploy instead.
      - name: Check JS syntax
        run: |
          for f in assets/js/*.js; do
            echo "checking $f"
            node --check "$f" || exit 1
          done

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (in "GitHub Actions" mode) on first run instead of
          # requiring the repo Settings → Pages toggle to be flipped by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
