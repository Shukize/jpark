name: Uptime health check

# Pings the production API on a schedule. If it doesn't return 200 (backend
# crashed, DB down, Neon suspended, Render error...), the job FAILS, and
# GitHub emails the repo owner about the failed run — so an outage is learned
# from monitoring, not from a staff member.
#
# Two targets, on two DIFFERENT schedules, and the split is the whole point:
#
#   /health     Process liveness. Touches no database, so it is free to call
#               often. Checked twice an hour.
#   /health/db  Actually runs a query, which WAKES Neon's compute and keeps it
#               awake for a full autosuspend window (~5 min) each time.
#               Checked four times a day — enough to catch a suspended or
#               unreachable database, cheap enough to leave the compute alone.
#
# Why this is not a keep-warm ping any more (changed 2026-08-03):
#   It used to run '*/5' with the goal of never letting Neon's compute
#   autosuspend, so guests wouldn't pay a cold start in live chat. Two things
#   were wrong with that. First, it never worked: GitHub throttles frequent
#   schedules hard, and this workflow was actually running about 21 times a
#   day (every 60-160 minutes), so the compute slept between pings regardless.
#   Second, on Neon's Free plan it is actively harmful — the month's allowance
#   is 100 CU-hours (~400 hours at 0.25 CU, against 730 hours in a month), and
#   those 21 wake-ups were burning ~13.6 CU-hours a month, about 14% of the
#   budget, to keep a database awake for nobody. A genuinely always-warm
#   compute would need ~186 CU-hours and cannot fit on Free at all.
#   So: the database is allowed to sleep, and backend/db.js's
#   connectionTimeoutMillis bounds what the first query pays to wake it.
#
# Notes:
#  - Public repo => unlimited Actions minutes, so this is free.
#  - Schedules are offset off the top of the hour on purpose; GitHub
#    de-prioritises runs requested at :00.
#  - GitHub can still delay any scheduled run, so treat this as "was the site
#    down for a while", not second-precision uptime.
#  - Make sure failure emails are on: GitHub → Settings → Notifications →
#    Actions → "Send notifications for failed workflows only" (on by default).
#  - A dedicated monitor like UptimeRobot (5-min checks, retries, dashboard) is
#    a good primary; this in-repo check is a zero-setup backstop.

on:
  schedule:
    - cron: '7,37 * * * *'        # liveness only — no database
    - cron: '23 3,9,15,21 * * *'  # liveness + a real database query
  workflow_dispatch: {}           # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 tries, 20s apart, to ride out a slow start)
        id: liveness
        run: |
          url="https://jpark.onrender.com/health"
          for i in 1 2 3; do
            body=$(curl -s -m 30 "$url" || echo '')
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "attempt $i: HTTP $code $body"
            if [ "$code" = "200" ]; then
              echo "J Park API is up."
              # Report which build is serving, so a run doubles as proof that
              # a push finished rolling out (see BUILD_COMMIT in server.js).
              commit=$(echo "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
              echo "deployed commit: ${commit:-unknown} (repo head: ${GITHUB_SHA:0:7})"
              echo "commit=${commit:-unknown}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::J Park API health check FAILED — $url did not return 200 after 3 attempts. The booking/staff backend may be down (check Render logs and Neon usage)."
          exit 1

      # Skipped on the twice-hourly schedule so it doesn't wake Neon; runs on
      # the 4x-daily schedule and whenever the workflow is started by hand.
      - name: Ping /health/db (wakes Neon — deliberately infrequent)
        if: github.event_name != 'schedule' || github.event.schedule == '23 3,9,15,21 * * *'
        run: |
          url="https://jpark.onrender.com/health/db"
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Database reachable."
            exit 0
          fi
          echo "::error::Database health check FAILED — $url returned $code. Neon may be suspended, over its cap, or unreachable — check the Neon dashboard."
          exit 1

      # Payment reconciliation — the backstop under the payment webhook.
      #
      # Omise does not guarantee retries for failed webhook deliveries, so a
      # single missed one would otherwise mean a guest paid and the hotel
      # never found out (see backend/paymentReconciler.js). The API watches
      # each charge in-process, but those timers die with a deploy, so this
      # catches anything a restart dropped.
      #
      # Deliberately attached to the 4x-daily schedule, NOT the twice-hourly
      # one: this query wakes Neon, and the step above has just woken it
      # anyway, so it rides along inside the same autosuspend window for no
      # extra compute. It is idempotent — a sweep with nothing to do is a
      # no-op, and a charge already recorded as paid is never re-emailed.
      #
      # Needs PAYMENT_WEBHOOK_SECRET as a repo secret ONLY if that variable is
      # set on the API; when it is unset the endpoint accepts the call without
      # a key, exactly like the webhook it backs up.
      - name: Reconcile pending payments (rides the Neon wake above)
        if: github.event_name != 'schedule' || github.event.schedule == '23 3,9,15,21 * * *'
        run: |
          url="https://jpark.onrender.com/api/v1/payments/reconcile"
          if [ -n "${{ secrets.PAYMENT_WEBHOOK_SECRET }}" ]; then
            url="$url?key=${{ secrets.PAYMENT_WEBHOOK_SECRET }}"
          fi
          body=$(curl -s -m 60 -X POST "$url" || echo '')
          code=$(curl -s -m 60 -o /dev/null -w "%{http_code}" -X POST "$url" || echo 000)
          echo "HTTP $code $body"
          if [ "$code" != "200" ]; then
            echo "::warning::Payment reconciliation returned $code. Pending online payments may not be getting confirmed — check the Render logs."
          fi
          # A recovery is newsworthy: it means a webhook was lost and the
          # backstop caught a real payment the hotel would otherwise have
          # missed. Surface it rather than burying it in the run log.
          recovered=$(echo "$body" | sed -n 's/.*"recovered":\([0-9]*\).*/\1/p')
          if [ -n "$recovered" ] && [ "$recovered" != "0" ]; then
            echo "::warning::Recovered $recovered payment(s) whose webhook never arrived. Payments are being confirmed by the backstop, not the webhook — verify the webhook URL is registered in the Omise dashboard."
          fi

      # Is the payment gateway still correctly configured?
      #
      # Every way this breaks is silent from the outside. The booking page
      # keeps offering to take a card, the form still submits, and the guest
      # only finds out at the moment they try to pay. Three real ways it has
      # already gone wrong or nearly gone wrong here:
      #
      #   - a rolled Omise secret key that was never copied into Render.
      #     Omise keeps the old key alive for 60 MINUTES after a roll, so the
      #     site looks perfectly healthy right up until it doesn't.
      #   - the webhook_uri being unset on the account, so payments complete
      #     at Omise and never reach the booking board.
      #   - live keys quietly replaced by test keys, or the reverse.
      #
      # This asks the API to check itself against Omise and fails the run if
      # anything is wrong, so the owner gets an email instead of a guest
      # getting a declined card. It costs one Omise API call, four times a
      # day, on the schedule that already wakes the database.
      - name: Check the payment gateway is still configured correctly
        if: github.event_name != 'schedule' || github.event.schedule == '23 3,9,15,21 * * *'
        env:
          KEY: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          if [ -z "$KEY" ]; then
            echo "PAYMENT_WEBHOOK_SECRET is not set as a repository secret — skipping."
            echo "Add it under Settings -> Secrets and variables -> Actions to enable this check."
            exit 0
          fi
          body=$(curl -s -m 60 "https://jpark.onrender.com/api/v1/payments/diagnostics?key=$KEY" || echo '')
          # Print with the mode visible but nothing sensitive: the endpoint
          # already redacts the webhook secret out of its own response.
          echo "$body"
          case "$body" in
            *'"ok":true'*)
              echo "Payment gateway configuration is healthy." ;;
            *'"ok":false'*)
              echo "::error::PAYMENT GATEWAY MISCONFIGURED — online card payments are at risk. Open https://jpark.onrender.com/api/v1/payments/diagnostics?key=YOUR_SECRET in a browser for the checklist. The most likely cause is a rolled Omise secret key that was never updated in Render."
              exit 1 ;;
            *)
              echo "::error::Could not read payment diagnostics (empty or unexpected response). The API may be down, or PAYMENT_WEBHOOK_SECRET may not match the value set in Render."
              exit 1 ;;
          esac
