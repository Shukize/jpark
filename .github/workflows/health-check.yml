name: Uptime health check

# Pings the production API's /health endpoint on a schedule. If it doesn't
# return 200 (backend crashed, DB down, Neon suspended, Render error...), the
# job FAILS, and GitHub emails the repo owner about the failed run — so an
# outage is learned from monitoring, not from a staff member. Running every
# ~10 minutes also nudges the free-tier Render service before its 15-minute
# idle spin-down, cutting cold-start 502s.
#
# Notes:
#  - Public repo => unlimited Actions minutes, so this is free.
#  - GitHub's scheduled runs can be delayed several minutes under load; this is
#    for "is the site down" alerting, not second-precision uptime.
#  - Make sure failure emails are on: GitHub → Settings → Notifications →
#    Actions → "Send notifications for failed workflows only" (on by default).
#  - A dedicated monitor like UptimeRobot (5-min checks, retries, dashboard) is
#    a good primary; this in-repo check is a zero-setup backstop.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 tries, 20s apart, to ride out cold starts)
        run: |
          url="https://jpark.onrender.com/health"
          for i in 1 2 3; do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "J Park API is up."
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "::error::J Park API health check FAILED — $url did not return 200 after 3 attempts. The booking/staff backend may be down (check Render logs and Neon usage)."
          exit 1
