name: Uptime health check

# Pings the production API on a schedule. If it doesn't return 200 (backend
# crashed, DB down, Neon suspended, Render error...), the job FAILS, and
# GitHub emails the repo owner about the failed run — so an outage is learned
# from monitoring, not from a staff member.
#
# Two targets, on two DIFFERENT schedules, and the split is the whole point:
#
#   /health     Process liveness. Touches no database, so it is free to call
#               often. Checked twice an hour.
#   /health/db  Actually runs a query, which WAKES Neon's compute and keeps it
#               awake for a full autosuspend window (~5 min) each time.
#               Checked four times a day — enough to catch a suspended or
#               unreachable database, cheap enough to leave the compute alone.
#
# Why this is not a keep-warm ping any more (changed 2026-08-03):
#   It used to run '*/5' with the goal of never letting Neon's compute
#   autosuspend, so guests wouldn't pay a cold start in live chat. Two things
#   were wrong with that. First, it never worked: GitHub throttles frequent
#   schedules hard, and this workflow was actually running about 21 times a
#   day (every 60-160 minutes), so the compute slept between pings regardless.
#   Second, on Neon's Free plan it is actively harmful — the month's allowance
#   is 100 CU-hours (~400 hours at 0.25 CU, against 730 hours in a month), and
#   those 21 wake-ups were burning ~13.6 CU-hours a month, about 14% of the
#   budget, to keep a database awake for nobody. A genuinely always-warm
#   compute would need ~186 CU-hours and cannot fit on Free at all.
#   So: the database is allowed to sleep, and backend/db.js's
#   connectionTimeoutMillis bounds what the first query pays to wake it.
#
# Notes:
#  - Public repo => unlimited Actions minutes, so this is free.
#  - Schedules are offset off the top of the hour on purpose; GitHub
#    de-prioritises runs requested at :00.
#  - GitHub can still delay any scheduled run, so treat this as "was the site
#    down for a while", not second-precision uptime.
#  - Make sure failure emails are on: GitHub → Settings → Notifications →
#    Actions → "Send notifications for failed workflows only" (on by default).
#  - A dedicated monitor like UptimeRobot (5-min checks, retries, dashboard) is
#    a good primary; this in-repo check is a zero-setup backstop.

on:
  schedule:
    - cron: '7,37 * * * *'        # liveness only — no database
    - cron: '23 3,9,15,21 * * *'  # liveness + a real database query
  workflow_dispatch: {}           # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 tries, 20s apart, to ride out a slow start)
        id: liveness
        run: |
          url="https://jpark.onrender.com/health"
          for i in 1 2 3; do
            body=$(curl -s -m 30 "$url" || echo '')
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "attempt $i: HTTP $code $body"
            if [ "$code" = "200" ]; then
              echo "J Park API is up."
              # Report which build is serving, so a run doubles as proof that
              # a push finished rolling out (see BUILD_COMMIT in server.js).
              commit=$(echo "$body" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
              echo "deployed commit: ${commit:-unknown} (repo head: ${GITHUB_SHA:0:7})"
              echo "commit=${commit:-unknown}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::J Park API health check FAILED — $url did not return 200 after 3 attempts. The booking/staff backend may be down (check Render logs and Neon usage)."
          exit 1

      # Skipped on the twice-hourly schedule so it doesn't wake Neon; runs on
      # the 4x-daily schedule and whenever the workflow is started by hand.
      - name: Ping /health/db (wakes Neon — deliberately infrequent)
        if: github.event_name != 'schedule' || github.event.schedule == '23 3,9,15,21 * * *'
        run: |
          url="https://jpark.onrender.com/health/db"
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Database reachable."
            exit 0
          fi
          echo "::error::Database health check FAILED — $url returned $code. Neon may be suspended, over its cap, or unreachable — check the Neon dashboard."
          exit 1
