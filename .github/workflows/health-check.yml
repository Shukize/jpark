name: Uptime health check

# Pings the production API on a schedule. If it doesn't return 200 (backend
# crashed, DB down, Neon suspended, Render error...), the job FAILS, and
# GitHub emails the repo owner about the failed run — so an outage is learned
# from monitoring, not from a staff member.
#
# Two separate targets on purpose:
#   /health     process liveness only (no DB). Cutting Render's old free-tier
#               cold start was the original point of pinging this often.
#   /health/db  actually runs a query. Neon's autosuspend compute goes to
#               sleep after a quiet spell; the FIRST query after that pays
#               the wake-up cost, which live chat felt worst (guest messages
#               are sent one-at-a-time in order — see postChain in chat.js —
#               so one slow/cold connection stalled every message queued
#               behind it, seen live as a multi-minute delay). Pinging this
#               every 5 minutes means the compute is never idle long enough
#               to suspend in the first place; backend/db.js's
#               connectionTimeoutMillis is the backstop for whenever it does.
#
# Notes:
#  - Public repo => unlimited Actions minutes, so this is free.
#  - GitHub's scheduled runs can be delayed several minutes under load; this is
#    for "is the site down" / "is Neon awake" nudging, not second-precision
#    uptime — a real gap can still occur right after a long GitHub-side delay.
#  - Make sure failure emails are on: GitHub → Settings → Notifications →
#    Actions → "Send notifications for failed workflows only" (on by default).
#  - A dedicated monitor like UptimeRobot (5-min checks, retries, dashboard) is
#    a good primary; this in-repo check is a zero-setup backstop.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # lets you run it on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 tries, 20s apart, to ride out cold starts)
        run: |
          url="https://jpark.onrender.com/health"
          for i in 1 2 3; do
            code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "J Park API is up."
              exit 0
            fi
            [ "$i" -lt 3 ] && sleep 20
          done
          echo "::error::J Park API health check FAILED — $url did not return 200 after 3 attempts. The booking/staff backend may be down (check Render logs and Neon usage)."
          exit 1
      - name: Ping /health/db (keeps Neon's compute from autosuspending)
        run: |
          url="https://jpark.onrender.com/health/db"
          code=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$url" || echo 000)
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "Database reachable."
            exit 0
          fi
          echo "::error::Database health check FAILED — $url returned $code. Neon may be suspended, over its cap, or unreachable — check the Neon dashboard."
          exit 1
